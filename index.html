<!doctype html>
<html lang="fr-CM">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Titre & Description (homepage / fallback) ── -->
  <title>Oumarou Sanda | Expert IA, Formateur &amp; Entrepreneur Digital</title>
  <meta name="description"
    content="Oumarou Sanda aide les entrepreneurs et créateurs africains à maîtriser l'IA pour générer des revenus. Formations, services, outils et stratégies pour bâtir un business digital rentable." />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <link rel="canonical" href="https://oumarousanda.com/" />

  <!-- ── Open Graph (homepage / fallback avant JS) ── -->
  <meta property="og:site_name" content="Oumarou Sanda" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Oumarou Sanda — L'IA au service du business africain" />
  <meta property="og:description"
    content="Expert en intelligence artificielle, formateur et entrepreneur digital. Formations, services et outils pour transformer ton business avec l'IA." />
  <meta property="og:url" content="https://oumarousanda.com/" />
  <meta property="og:image" content="https://oumarousanda.com/SANDA.webp" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Oumarou Sanda — Expert IA Générative" />
  <meta property="og:locale" content="fr_CM" />

  <!-- ── Twitter / X Card (homepage / fallback) ── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Oumarou Sanda — L'IA au service du business africain" />
  <meta name="twitter:description"
    content="Expert en intelligence artificielle, formateur et entrepreneur digital. Formations, services et outils pour transformer ton business avec l'IA." />
  <meta name="twitter:image" content="https://oumarousanda.com/SANDA.webp" />

  <!-- ── Favicon ── -->
  <!-- favicon.ico et apple-touch-icon.png à générer via realfavicongenerator.net -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />

  <!-- ── Google AdSense — chargé après window.load pour ne pas bloquer le rendu ── -->
  <!-- Le script est injecté dynamiquement via AdUnit.tsx -->

  <!-- ── Preload images critiques ── -->
  <link rel="preload" as="image" href="/Oumarou%20Sanda%20CEO%20Wendooka%203.webp" fetchpriority="high"
    type="image/webp" />
  <link rel="preload" as="image" href="/logo-sm.webp" type="image/webp" />

  <!-- ── DNS Prefetch tiers ── -->
  <link rel="dns-prefetch" href="https://img.youtube.com" />
  <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />

  <!-- ── Fonts (non-blocking — évite 2.2s de rendu bloqué) ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&family=JetBrains+Mono:wght@400&display=swap" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&family=JetBrains+Mono:wght@400&display=swap" />
  </noscript>

  <!-- ── Schema.org JSON-LD global (Person + Organisation) ── -->
  <!--
      Note : chaque page surcharge le schéma via react-helmet-async (SEOHead).
      Ce bloc sert de fallback statique pour les crawlers qui n'exécutent pas JS.
    -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://oumarousanda.com/#person",
            "name": "Oumarou Sanda",
            "alternateName": "Oumarou Sanda Aboubakar",
            "jobTitle": "Expert Intelligence Artificielle, Formateur, Entrepreneur Digital",
            "description": "Entrepreneur digital et expert en intelligence artificielle basé à Ngaoundéré, Cameroun. Fondateur de Wendooka, Sanda Vibe Code et CommentSticker. Auteur et formateur pour entrepreneurs africains francophones.",
            "url": "https://oumarousanda.com",
            "image": "https://oumarousanda.com/SANDA.webp",
            "birthPlace": {
              "@type": "Place",
              "addressCountry": "CM",
              "addressRegion": "Adamaoua"
            },
            "nationality": "Camerounaise",
            "knowsLanguage": ["fr", "en"],
            "knowsAbout": ["Intelligence Artificielle", "Marketing Digital", "Vibe Coding", "Création de Contenu IA", "Business Digital", "Entrepreneuriat Africain"],
            "sameAs": [
              "https://www.youtube.com/@Oumarou_Sanda",
              "https://tiktok.com/@iamsanda",
              "https://linkedin.com/in/benibsanda",
              "https://facebook.com/iamoumarousanda",
              "https://wendooka.com",
              "https://sandavibecode.com",
              "https://commentsticker.com"
            ],
            "worksFor": [
              { "@type": "Organization", "name": "Wendooka", "url": "https://wendooka.com" },
              { "@type": "Organization", "name": "Sanda Vibe Code", "url": "https://sandavibecode.com" }
            ]
          },
          {
            "@type": "Organization",
            "@id": "https://wendooka.com/#organization",
            "name": "Wendooka",
            "url": "https://wendooka.com",
            "founder": { "@type": "Person", "name": "Oumarou Sanda" },
            "foundingDate": "2017",
            "description": "Agence web et digitale spécialisée WordPress, automatisation et solutions digitales orientées performance.",
            "areaServed": ["Cameroun", "Afrique francophone"],
            "address": {
              "@type": "PostalAddress",
              "addressCountry": "CM",
              "addressRegion": "Adamaoua",
              "addressLocality": "Ngaoundéré"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://oumarousanda.com/#website",
            "url": "https://oumarousanda.com",
            "name": "Oumarou Sanda",
            "description": "Site officiel d'Oumarou Sanda, expert en intelligence artificielle et entrepreneur digital.",
            "publisher": { "@type": "Person", "@id": "https://oumarousanda.com/#person" },
            "inLanguage": ["fr", "en"],
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://oumarousanda.com/blog?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
