server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── www → non-www (301 permanent) ────────────────────────────
    if ($http_host = "www.oumarousanda.com") {
        return 301 https://oumarousanda.com$request_uri;
    }

    # ── Hardening contre les 5XX ──────────────────────────────────
    # Buffers élargis pour gérer les URLs longues / cookies lourds (sinon 400/500)
    large_client_header_buffers 8 32k;
    client_header_buffer_size 8k;
    client_max_body_size 10m;
    # Timeouts raisonnables
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    # En cas d'erreur upstream/interne, servir le SPA (pas un 500 blanc)
    error_page 500 502 503 504 /index.html;

    # ── Security Headers ──────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://partner.googleadservices.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; media-src 'self' https:; frame-src https://www.youtube.com https://player.vimeo.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; frame-ancestors 'none';" always;

    # ── Gzip Compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ══════════════════════════════════════════════════════════════
    #  410 GONE — Attack vectors & ex-WordPress infra (Google oublie vite)
    # ══════════════════════════════════════════════════════════════
    # 410 dit à Google : "cette URL n'existera plus jamais, désindexe-la."
    # 404 = "peut-être temporaire", retry. 410 = définitif, oubli rapide.

    location ~* ^/wp-admin(/.*)?$      { return 410; }
    location ~* ^/wp-login\.php$       { return 410; }
    location ~* ^/wp-content(/.*)?$    { return 410; }
    location ~* ^/wp-includes(/.*)?$   { return 410; }
    location ~* ^/wp-json(/.*)?$       { return 410; }
    location ~* ^/wp-cron\.php$        { return 410; }
    location ~* ^/xmlrpc\.php$         { return 410; }
    location ~* ^/wlwmanifest\.xml$    { return 410; }
    location ~* ^/readme\.html$        { return 410; }
    location ~* ^/license\.txt$        { return 410; }
    location ~* ^/phpmyadmin(/.*)?$    { return 410; }
    location ~* ^/administrator(/.*)?$ { return 410; }
    location ~* ^/cgi-bin(/.*)?$       { return 410; }
    location ~* ^/vendor(/.*)?$        { return 410; }
    location = /.env                   { return 410; }
    location = /.git                   { return 410; }

    # ══════════════════════════════════════════════════════════════
    #  301 REDIRECTIONS — Ex-WordPress URLs vers nouvelles pages
    # ══════════════════════════════════════════════════════════════

    # ── Articles spécifiques ──
    rewrite ^/comment-creer-une-societe-offshore-au-royaume-uni/?$ /blog/societe-offshore-royaume-uni-afrique permanent;
    rewrite ^/fr/comment-creer-une-societe-offshore-au-royaume-uni/?$ /blog/societe-offshore-royaume-uni-afrique permanent;
    rewrite ^/fr/comment-creer-une-societe-offshore-au-royaume-uni-2/?$ /blog/societe-offshore-royaume-uni-afrique permanent;
    rewrite ^/how-to-create-an-offshore-company-in-uk/?$ /blog/societe-offshore-royaume-uni-afrique permanent;
    rewrite ^/comment-acheter-de-la-crypto-monnaie-en-afrique-sur-binance-avec-mobile-money/?$ /blog/mobile-money-business-digital-afrique permanent;
    rewrite ^/fr/comment-gagner-de-largent-sur-internet-en-afrique/?$ /blog/gagner-argent-ia-2026 permanent;
    rewrite ^/fr/comment-gagner-de-largent-avec-les-livres-audio/?$ /blog/gagner-argent-ia-2026 permanent;
    rewrite ^/fr/comment-gagner-100-euros-par-jour/?$ /blog/gagner-argent-ia-2026 permanent;
    rewrite ^/fr/izimentor-avis/?$ /blog/izimentor-avis-2025 permanent;

    # ── Pages génériques FR ──
    rewrite ^/fr/?$ / permanent;
    rewrite ^/fr/blog/?$ /blog permanent;
    rewrite ^/fr/ressources/?$ /ressources permanent;
    rewrite ^/fr/contact/?$ /contact permanent;
    rewrite ^/online-business-ressources/?$ /ressources permanent;
    rewrite ^/privacy-policy/?$ / permanent;
    rewrite ^/fr/politique-de-confidentialite/?$ / permanent;
    rewrite ^/terms-and-conditions/?$ / permanent;
    rewrite ^/fr/conditions-generales-dutilisation/?$ / permanent;

    # ── Articles orphelins → /blog ──
    rewrite ^/how-to-make-money-with-nfts-ultimate-guide-for-beginners/?$ /blog permanent;
    rewrite ^/bmo-online-banking-sign-in/?$ /blog permanent;
    rewrite ^/banque-montreal-service-en-ligne/?$ /blog permanent;
    rewrite ^/getresponse-review/?$ /blog permanent;
    rewrite ^/cloudways-review/?$ /blog permanent;
    rewrite ^/best-free-vpn/?$ /blog permanent;
    rewrite ^/poppy-ai-review/?$ /blog permanent;
    rewrite ^/reasons-why-you-need-an-ai-powered-copywriter/?$ /blog permanent;
    rewrite ^/comment-rediger-des-articles-de-blog-avec-lintelligence-artificielle/?$ /blog permanent;
    rewrite ^/comprendre-le-fonds-tiktok-pour-les-createurs/?$ /blog permanent;
    rewrite ^/fr/comprendre-le-fonds-tiktok-pour-les-createurs/?$ /blog permanent;
    rewrite ^/les-etapes-cles-de-la-creation-dune-strategie-de-marketing-en-ligne-coherente-et-performante/?$ /blog permanent;
    rewrite ^/fr/les-etapes-cles-de-la-creation-dune-strategie-de-marketing-en-ligne-coherente-et-performante/?$ /blog permanent;
    rewrite ^/how-to-start-a-blog-that-makes-money/?$ /blog permanent;
    rewrite ^/comment-creer-une-chaine-youtube-monetisable/?$ /blog permanent;
    rewrite ^/fr/comment-creer-une-chaine-youtube-monetisable/?$ /blog permanent;
    rewrite ^/fr/comment-creer-un-blog/?$ /blog permanent;

    # ══════════════════════════════════════════════════════════════
    #  301 CATCH-ALL — Patterns WordPress génériques (les ~400 URLs restantes)
    # ══════════════════════════════════════════════════════════════
    # Couvre en bloc les structures WP typiques qu'Ahrefs/Google a en mémoire
    # depuis l'ancien site. Tous → /blog (ou page appropriée).

    # Catégories et tags WordPress → blog
    rewrite ^/category/.*$                        /blog permanent;
    rewrite ^/fr/category/.*$                     /blog permanent;
    rewrite ^/tag/.*$                             /blog permanent;
    rewrite ^/fr/tag/.*$                          /blog permanent;
    rewrite ^/topics/.*$                          /blog permanent;
    rewrite ^/fr/topics/.*$                       /blog permanent;

    # Archives par auteur → à-propos
    rewrite ^/author/.*$                          /a-propos permanent;
    rewrite ^/fr/author/.*$                       /a-propos permanent;

    # Archives par date → blog
    rewrite ^/[0-9]{4}/?$                         /blog permanent;
    rewrite ^/[0-9]{4}/[0-9]{2}/?$                /blog permanent;
    rewrite ^/[0-9]{4}/[0-9]{2}/[0-9]{2}/?$       /blog permanent;
    rewrite ^/fr/[0-9]{4}/?$                      /blog permanent;
    rewrite ^/fr/[0-9]{4}/[0-9]{2}/?$             /blog permanent;

    # Pagination WordPress
    rewrite ^/page/[0-9]+/?$                      /blog permanent;
    rewrite ^/fr/page/[0-9]+/?$                   /blog permanent;
    rewrite ^/blog/page/[0-9]+/?$                 /blog permanent;
    rewrite ^/fr/blog/page/[0-9]+/?$              /blog permanent;

    # Flux RSS / Atom WordPress → blog
    rewrite ^/feed/?$                             /blog permanent;
    rewrite ^/feed/atom/?$                        /blog permanent;
    rewrite ^/feed/rss/?$                         /blog permanent;
    rewrite ^/feed/rss2/?$                        /blog permanent;
    rewrite ^/comments/feed/?$                    /blog permanent;
    rewrite ^/fr/feed/?$                          /blog permanent;
    rewrite ^/(.*)/feed/?$                        /blog permanent;

    # Pièces jointes WP
    rewrite ^/attachment/.*$                      /blog permanent;
    rewrite ^/fr/attachment/.*$                   /blog permanent;

    # Trackback / ping
    rewrite ^/(.*)/trackback/?$                   /blog permanent;

    # Préfixe /fr/ résiduel → strip le préfixe, redirige vers la version FR
    rewrite ^/fr/(.*)$                            /$1 permanent;

    # ══════════════════════════════════════════════════════════════
    #  Fichiers racine — Content-Type forcé
    # ══════════════════════════════════════════════════════════════

    location = /sitemap.xml {
        types { } default_type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        types { } default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /ads.txt {
        types { } default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        types { } default_type "application/manifest+json; charset=utf-8";
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # ── Cache: index.html — never cached (always fresh) ──────────
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── Cache: Assets with hashed filenames (immutable, 1 year) ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Cache: Images & Fonts (6 months) ─────────────────────────
    location ~* \.(webp|avif|png|jpg|jpeg|gif|ico|woff2|woff|ttf|eot)$ {
        expires 180d;
        add_header Cache-Control "public, max-age=15552000, stale-while-revalidate=86400" always;
    }

    # ── Cache: SVG (1 month) ──────────────────────────────────────
    location ~* \.svg$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # ── Block sensitive files (dotfiles etc.) ────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(env|git|log|sh|bak|old|sql|ini|conf)$ {
        deny all;
        return 404;
    }

    # ══════════════════════════════════════════════════════════════
    #  SPA Fallback — routes React (prerendered HTML par route)
    # ══════════════════════════════════════════════════════════════
    # try_files : URI exacte > URI/ (dossier avec index.html prerendered) > SPA shell
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
